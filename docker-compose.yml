services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/tasks.db
      DEFAULT_LEASE_SECONDS: "30"
    volumes:
      - task-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  task-data:
